R.write=()=>{if(!WI)WI=pick(SETS[WS]);M.innerHTML=`<h1>Écriture</h1><div class=c id=wc><div class=opts>${[['h','Hiragana'],['k','Katakana'],['j','Kanji']].map(([k,l])=>`<button class="btn ${WS==k?'p':''}" onclick="WS='${k}';WI=0;R.write()">${l}</button>`).join('')}</div><p>Trace : <b>${WI[1]}</b> ${WS=='j'?'<span class=mu>('+WI[2]+')</span>':''}</p><div class=st><div class=gh style="${WG?'':'display:none'}">${WI[0]}</div><canvas id=cv width=300 height=300></canvas></div><div class=opts><button class=btn onclick=R.write()>Effacer</button><button class=btn onclick="WG^=1;$('.gh').style.display=WG?'':'none'">Filigrane</button><button class="btn p" onclick=ev()>Évaluer</button><button class=btn onclick="WI=0;R.write()">Suivant</button></div><div id=wr class=mu>Trace le caractère au doigt ou à la souris.</div></div>`;
let c=$('#cv'),x=c.getContext('2d'),d=0;x.lineWidth=14;x.lineCap=x.lineJoin='round';x.strokeStyle=getComputedStyle(M).color;
const pt=e=>{let r=c.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*300/r.height]};
c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);let[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b);x.stroke()};
c.onpointermove=e=>{if(!d)return;let[a,b]=pt(e);x.lineTo(a,b);x.stroke()};c.onpointerup=()=>d=0};
function ev(){let g=document.createElement('canvas');g.width=g.height=300;let x=g.getContext('2d');x.font='900 230px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(WI[0],150,158);
let G=cells(x).map(v=>v>15),U=cells($('#cv').getContext('2d')).map(v=>v>8),gd=dil(G),ud=dil(U),gs=G.filter(Boolean).length||1,us=U.filter(Boolean).length;

let rc=G.filter((v,i)=>v&&ud[i]).length/gs,pr=U.filter((v,i)=>v&&gd[i]).length/us,sc=Math.round(100*Math.sqrt(rc*pr)),st=sc>=80?3:sc>=65?2:sc>=45?1:0;
if(st>=2){P().kn[WI[3]+WI[0]]=1;save()}

let A=null;
function stopArc(){if(A){cancelAnimationFrame(A.f);A=null}}
R.arc=()=>{M.innerHTML=`<h1>Syllable Drop</h1><div class="c row"><span id=hp></span><span id=sc>Score 0</span><span id=cb></span><span class=mu>Record ${P().hs}</span></div><div id=ar class=ar><div class=go>Tape le romaji des kana<br>avant qu'ils tombent</div></div><input id=ai class=in placeholder="romaji… (Entrée pour valider)" autocomplete=off autocapitalize=off><button class="btn p" onclick=arcGo()>Jouer</button>`;$('#ai').oninput=e=>arcIn();$('#ai').onkeydown=e=>e.key=='Enter'&&arcIn(1)};
const hud=()=>{$('#hp').textContent=ic('❤️','♥').repeat(A.hp);$('#sc').textContent='Score '+A.sc;$('#cb').textContent=A.cb>1?'Combo ×'+A.cb:''};
function arcGo(){stopArc();$('#ar').innerHTML='';A={hp:5,sc:0,cb:0,it:[],nx:0,last:performance.now()};hud();$('#ai').focus();A.f=requestAnimationFrame(arcLoop)}
function arcLoop(t){if(!A)return;let ar=$('#ar'),dt=Math.min(50,t-A.last);A.last=t;A.nx-=dt;
if(A.nx<=0){let it=pick(SETS.h.concat(SETS.k)),el=h('div','fl jp',it[0]);el.style.left=Math.random()*(ar.clientWidth-60)+'px';ar.append(el);A.it.push({el,y:-50,r:it[1]});A.nx=Math.max(550,1600-A.sc*3)}
for(let o of [...A.it]){o.y+=.055*dt*(1+A.sc/400);o.el.style.transform=`translateY(${o.y}px)`;if(o.y>ar.clientHeight-48){miss(o,ar);if(!A)return}}
A.f=requestAnimationFrame(arcLoop)}
function miss(o,ar){A.it=A.it.filter(x=>x!=o);o.el.remove();A.hp--;A.cb=0;let im=h('div','imp');im.style.left=o.el.style.left;ar.append(im);setTimeout(()=>im.remove(),500);ar.classList.remove('hit');void ar.offsetWidth;ar.classList.add('hit');if(A.hp<=0){let s=A.sc,p=P();if(s>p.hs)p.hs=s;gain(s/5|0);stopArc();ar.innerHTML=`<div class=go>Game Over<br>${s} pts</div>`;return}hud()}
function arcIn(f){if(!A)return;let i=$('#ai'),v=i.value.trim().toLowerCase();if(!v)return;let c=A.it.filter(x=>x.r==v);

if(/bonjour|salut|hello|こんにちは/.test(l))return['こんにちは ! (konnichiwa) Quel mot veux-tu apprendre ?','こんにちは'];
